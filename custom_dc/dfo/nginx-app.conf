# DFO prototyping app — proxied to the internal Next.js server on :3000.
# Included by build/cdc_services/nginx.conf via glob:
#   include /workspace/custom_dc/*/nginx-*.conf;
#
# basePath '/prototype' (next.config.mjs) means Next expects incoming paths to
# start with /prototype. We pass the path through unchanged (no URI on
# proxy_pass) — stripping /prototype here would break asset resolution.
#
# Next owns URL canonicalization: with the default trailingSlash=false it serves
# /prototype and redirects /prototype/ -> /prototype. nginx must NOT add its own
# /prototype -> /prototype/ redirect — that fights Next's redirect and produces
# an infinite loop. So both the bare path and everything under /prototype/ proxy
# straight through, unchanged.
#
# No CORS headers: this is a server-side-only route, not a public API surface.

location = /prototype {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
}

location /prototype/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
}

# Search API: proxied to Next.js on :3000, which rewrites/proxies to dfo-apis
# (the DFO_APIS_BASE_URL origin baked in at build time).
# Buffering disabled so SSE streams are delivered immediately.
location /api/search/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
    proxy_buffering off;
}

# Datasets API: proxied to Next.js on :3000, which rewrites/proxies to dfo-apis
# (the DFO_APIS_BASE_URL origin baked in at build time).
location /api/datasets {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
}

# Legacy redirect: /app moved to /prototype. Preserves sub-path and query
# string (e.g. /app/search?x=1 -> /prototype/search?x=1). Drop once no clients
# still link to /app.
location = /app {
    return 301 /prototype;
}

location ^~ /app/ {
    rewrite ^/app/(.*)$ /prototype/$1 permanent;
}
