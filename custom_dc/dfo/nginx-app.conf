# DFO prototyping app — proxied to the internal Next.js server on :3000.
# Included by build/cdc_services/nginx.conf via glob:
#   include /workspace/custom_dc/*/nginx-*.conf;
#
# basePath '/prototype' (next.config.mjs) means Next expects incoming paths to
# start with /prototype. We pass the path through unchanged (no URI on
# proxy_pass) — stripping /prototype here would break asset resolution.
#
# Next owns URL canonicalization: with the default trailingSlash=false it serves
# /prototype and redirects /prototype/ -> /prototype. nginx must NOT add its own
# /prototype -> /prototype/ redirect — that fights Next's redirect and produces
# an infinite loop. So both the bare path and everything under /prototype/ proxy
# straight through, unchanged.
#
# No CORS headers: this is a server-side-only route, not a public API surface.

# Response compression for the whole server. This file is included inside
# server {}, so the directives also cover the / and /core/api/ locations in
# nginx.conf. Level 1 keeps CPU cost low on large responses.
# gzip_proxied any keeps compression on for requests that carry a Via header,
# which a load balancer or CDN in front of the service adds. text/html is
# always compressed by nginx. text/event-stream is left out so SSE events are
# not buffered. The SDMX type needs its version parameter spelled out or it
# does not match.
gzip on;
gzip_comp_level 1;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    text/csv
    "application/vnd.sdmx.data+csv;version=2.0.0";

location = /prototype {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
}

location /prototype/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
}

# Search API: proxied to Next.js on :3000, which rewrites/proxies to the website's
# /api/search (the DFO_SITE_ORIGIN origin baked in at build time).
# Buffering disabled so SSE streams are delivered immediately.
location /api/search/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
    proxy_buffering off;
}

# Datasets API: proxied to Next.js on :3000, which rewrites/proxies to the website's
# /api/datasets (the DFO_SITE_ORIGIN origin baked in at build time).
location /api/datasets {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
}

# Legacy redirect: /app moved to /prototype. Preserves sub-path and query
# string (e.g. /app/search?x=1 -> /prototype/search?x=1). Drop once no clients
# still link to /app.
location = /app {
    return 301 /prototype;
}

location ^~ /app/ {
    rewrite ^/app/(.*)$ /prototype/$1 permanent;
}
