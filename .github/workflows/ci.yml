name: CI

# ONE/DFO: runs checks.yml (the DFO-owned lint/typecheck/test jobs) on pull
# requests into dev and main.
#
# A draft pull request runs nothing; marking it ready starts the run. A push
# to dev has no run here, because deploy-dev.yml runs checks.yml on the merged
# tree before it builds.
#
# Does not build the Docker image. build/cdc_services/Dockerfile compiles
# the Go mixer, installs the website's Python venv, builds the website's
# static assets, and runs a Next.js production build, in four build stages
# -- several minutes even with cache, so it only runs on push to a deploy
# branch, in deploy-dev.yml and deploy-prod.yml, with a registry-backed
# cache to keep that path fast.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/checks.yml
