name: Build and pin

# ONE/DFO: the reusable body behind deploy-dev.yml and deploy-prod.yml. Builds
# and pushes the dcp image, then opens a PR in the infra repo that moves the
# Terraform image pin. dcp's Cloud Run service lives inside a pinned upstream
# Terraform module, so its image is a Terraform-managed attribute. Unlike
# ai and apis, this repo can't deploy with `gcloud run services
# update`, since the next `terraform apply` would revert it. The infra repo's
# own apply-on-merge does the deploy once the pin PR lands.
#
# The pin PR goes to DevelopmentFinanceObservatory/infra, into the branch the
# caller names in `infra-base`: dev pins land on infra `dev`, prod pins on
# infra `main`.
#
# The job declares the caller's environment, which supplies every GCP name
# (vars.REGION, vars.PROJECT_ID, vars.AR_REPO, vars.AR_CACHE_REPO,
# vars.DFO_APIS_BASE_URL), the WIF_PROVIDER/WIF_SA secrets, and the pair for the
# GitHub App that opens the pin PR. A caller job that uses a reusable workflow
# cannot declare an environment, so it cannot hand environment-level values
# down. The caller names its App in the `app` input and the job reads only that
# App's pair:
#   dfo-pin:     vars.PIN_APP_CLIENT_ID, secrets.PIN_APP_PRIVATE_KEY (dev)
#   dfo-release: vars.RELEASE_APP_CLIENT_ID, secrets.RELEASE_APP_PRIVATE_KEY (production)
# A called workflow sees no secrets, its environment's included, unless the
# caller passes them, so each caller uses `secrets: inherit`.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment the job runs in (dev, production).
        required: true
        type: string
      tier:
        description: Short tier name in the image tag, pin branch, and tfvars path (dev, prod).
        required: true
        type: string
      deploy-branch:
        description: The only branch this workflow pins from.
        required: true
        type: string
      infra-base:
        description: The infra branch the pin PR targets (dev, main).
        required: true
        type: string
      auto-merge:
        description: Arm auto-merge on the pin PR.
        required: true
        type: boolean
      app:
        description: The GitHub App that opens the pin PR (dfo-pin, dfo-release).
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-and-pin:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      # The registry path without a tag, for the image itself.
      IMAGE_PATH: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.AR_REPO }}/dfo-services-image
      # Buildx cache manifests live in their own repo, not AR_REPO: AR IAM
      # grants writer at the repository level, and dfo-ai-deployer/
      # dfo-apis-deployer both hold writer on AR_REPO too, so a shared cache
      # repo would let either overwrite dcp's buildcache tag. dfo-dcp-deployer
      # is the only writer on AR_CACHE_REPO.
      CACHE_PATH: ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.AR_CACHE_REPO }}/dfo-services-image
      TIER: ${{ inputs.tier }}
      INFRA_OWNER: DevelopmentFinanceObservatory
      INFRA_NAME: infra
      INFRA_REPO: DevelopmentFinanceObservatory/infra
      INFRA_BASE: ${{ inputs.infra-base }}
    steps:
      # Runs before authentication, so a missing variable or secret fails here
      # with its name, not as an empty input inside an action or a failed Next
      # build.
      - name: Check the environment is configured
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APP: ${{ inputs.app }}
          REGION: ${{ vars.REGION }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          AR_REPO: ${{ vars.AR_REPO }}
          AR_CACHE_REPO: ${{ vars.AR_CACHE_REPO }}
          DFO_APIS_BASE_URL: ${{ vars.DFO_APIS_BASE_URL }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SA: ${{ secrets.WIF_SA }}
          PIN_APP_CLIENT_ID: ${{ vars.PIN_APP_CLIENT_ID }}
          PIN_APP_PRIVATE_KEY: ${{ secrets.PIN_APP_PRIVATE_KEY }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          required="REGION PROJECT_ID AR_REPO AR_CACHE_REPO DFO_APIS_BASE_URL WIF_PROVIDER WIF_SA"
          case "$APP" in
            dfo-pin) required="$required PIN_APP_CLIENT_ID PIN_APP_PRIVATE_KEY" ;;
            dfo-release) required="$required RELEASE_APP_CLIENT_ID RELEASE_APP_PRIVATE_KEY" ;;
            *) echo "::error::Unknown app '$APP'; expected dfo-pin or dfo-release."; exit 1 ;;
          esac
          missing=""
          for v in $required; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::The '$ENVIRONMENT' GitHub Environment is missing:$missing -- see deploy/README.md for who provides each."
            exit 1
          fi

      - name: Free disk space
        # ubuntu-latest has ~14 GB usable, and this build pulls large NL
        # model/embedding files, installs torch CPU wheels, and exports every
        # intermediate layer via mode=max cache-to. Removing the runner's
        # preinstalled Android SDK, .NET, and GHC toolchains buys back room
        # without a third-party action.
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          df -h /

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Dockerfile's mixer stage copies files straight out of the
          # submodule checkout; an uninitialized mixer/ fails the build.
          # import/ isn't used here but recursive costs little and matches
          # `just build`.
          submodules: recursive

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}
          token_format: access_token

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Resolve image ref
        id: target
        run: |
          # mixer_hash is the gitlink SHA the superproject pins mixer/ at, read
          # from the commit's tree so it needs no submodule fetch. It's baked
          # into the image below -- see the build step's build-args.
          {
            echo "image=${IMAGE_PATH}:dfo-${TIER}-${GITHUB_SHA}"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "mixer_hash=$(git rev-parse --short=7 HEAD:mixer)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: build/cdc_services/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.target.outputs.image }}
          # mixer's version handler serves GitHash straight from $MIXER_HASH
          # (internal/server/handler.go), which the Dockerfile's runner stage
          # takes from this build arg. Without it `/core/api/version` returns
          # an empty git_hash and the only way to learn which mixer a live
          # revision runs is to trace its image digest back through the infra
          # repo's apply runs.
          #
          # WEBSITE_HASH is deliberately not passed. Both ARGs sit at the top
          # of the runner stage, so setting either invalidates that stage's
          # cache; keying on the mixer pin alone means the rebuild happens only
          # on the rare commits that move the submodule, and the website SHA is
          # already recoverable from the image tag.
          #
          # DFO_APIS_BASE_URL is the apis origin next.config.mjs bakes into
          # the /api/search and /api/datasets rewrites. The Next build stage
          # fails when it is empty.
          build-args: |
            MIXER_HASH=${{ steps.target.outputs.mixer_hash }}
            DFO_APIS_BASE_URL=${{ vars.DFO_APIS_BASE_URL }}
          # Registry-backed cache, not GHA's own cache backend, which is
          # capped and evicted too aggressively for this build. mode=max
          # caches every intermediate layer, so the mixer and Next.js build
          # stages are reusable across runs, not just the final image.
          #
          # image-manifest=true,oci-mediatypes=true: without it, buildx's
          # mode=max cache-to writes an OCI index whose config Artifact
          # Registry rejects with a 400 on push, which fails the build step.
          cache-from: type=registry,ref=${{ env.CACHE_PATH }}:buildcache
          cache-to: type=registry,ref=${{ env.CACHE_PATH }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Resolve image digest
        id: digest
        run: |
          # docker/build-push-action's digest output is buildx's
          # containerimage.digest, already in "sha256:<hex>" form -- adding
          # our own sha256: prefix here would double it.
          echo "image=${IMAGE_PATH}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # workflow_dispatch can run from any ref, and this job's App token
      # isn't ref-scoped, so the real boundary is the environment's
      # deployment branch policy plus the WIF binding's attribute.repo_env_ref
      # condition -- both restrict this job to running for deploy-branch at
      # all. This `if` is belt-and-braces on top of that, guarding the mint,
      # checkout, and pin steps that touch the App token and the infra repo.
      # The check step above has already failed the job if the named App's
      # pair is unset, so each expression resolves to that App's value.
      - name: Mint the infra repo App token
        id: app-token
        if: github.ref == format('refs/heads/{0}', inputs.deploy-branch)
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app == 'dfo-pin' && vars.PIN_APP_CLIENT_ID || vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ inputs.app == 'dfo-pin' && secrets.PIN_APP_PRIVATE_KEY || secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ env.INFRA_OWNER }}
          repositories: ${{ env.INFRA_NAME }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the infra repo
        if: github.ref == format('refs/heads/{0}', inputs.deploy-branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.INFRA_REPO }}
          ref: ${{ inputs.infra-base }}
          token: ${{ steps.app-token.outputs.token }}
          path: infra-repo

      - name: Rewrite the pin line
        id: rewrite
        if: github.ref == format('refs/heads/{0}', inputs.deploy-branch)
        working-directory: infra-repo
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image }}
          SHORT_SHA: ${{ steps.target.outputs.short_sha }}
        run: |
          set -euo pipefail

          TFVARS="infra/dfo-${TIER}/dcp/image.auto.tfvars"

          if [ ! -f "$TFVARS" ]; then
            echo "::error::$TFVARS not found in ${INFRA_REPO} -- contract mismatch, see deploy/README.md."
            exit 1
          fi

          # Rewrite only the assignment line. The header comment the infra
          # repo owns in this file is left untouched.
          sed -i -E "s|^datacommons_services_image[[:space:]]*=.*|datacommons_services_image = \"${IMAGE_REF}\"|" "$TFVARS"

          if ! grep -qF "datacommons_services_image = \"${IMAGE_REF}\"" "$TFVARS"; then
            echo "::error::Failed to rewrite $TFVARS -- no matching assignment line found."
            exit 1
          fi

          # The base branch can already carry this sha's pin (a redeploy, or
          # a re-run after the previous run's PR merged), in which case sed
          # matched nothing to change and there's no diff to commit.
          if git diff --quiet -- "$TFVARS"; then
            echo "::notice::${INFRA_BASE} already pinned to this digest, nothing to commit"
            changed=false
          else
            changed=true
          fi
          {
            echo "changed=$changed"
            echo "tfvars=$TFVARS"
            echo "branch=deploy/dcp-${TIER}"
            echo "title=chore(dcp): pin ${TIER} image to ${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      # The pin commit is built through the REST git database API ("Create a
      # tree" and "Create a commit", docs.github.com/en/rest/git), so it is
      # authored by the App and GitHub signs it. Its one parent is the base
      # branch's head, and the pin branch is force-moved to it.
      - name: Commit the pin through the API
        if: steps.rewrite.outputs.changed == 'true'
        working-directory: infra-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TFVARS: ${{ steps.rewrite.outputs.tfvars }}
          BRANCH: ${{ steps.rewrite.outputs.branch }}
          TITLE: ${{ steps.rewrite.outputs.title }}
        run: |
          set -euo pipefail

          parent="$(git rev-parse HEAD)"
          # The tree git would write for this change, to check the API's
          # tree against.
          git add "$TFVARS"
          want_tree="$(git write-tree)"

          tree="$(jq -n \
            --arg base "$(git rev-parse 'HEAD^{tree}')" \
            --arg path "$TFVARS" \
            --rawfile content "$TFVARS" \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", content: $content}]}' |
            gh api "repos/${INFRA_REPO}/git/trees" --input - --jq .sha)"
          if [ "$tree" != "$want_tree" ]; then
            echo "::error::The API built tree $tree, and the local change gives $want_tree."
            exit 1
          fi

          sha="$(jq -n --arg message "$TITLE" --arg tree "$tree" --arg parent "$parent" \
            '{message: $message, tree: $tree, parents: [$parent]}' |
            gh api "repos/${INFRA_REPO}/git/commits" --input - --jq .sha)"

          # Force-moved to a single reused branch, so that if two runs ever
          # interleave, the last writer wins and no stale pin survives.
          if gh api "repos/${INFRA_REPO}/git/ref/heads/${BRANCH}" --silent 2>/dev/null; then
            gh api -X PATCH "repos/${INFRA_REPO}/git/refs/heads/${BRANCH}" \
              -f sha="$sha" -F force=true --silent
          else
            gh api -X POST "repos/${INFRA_REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$sha" --silent
          fi
          echo "::notice::Pinned in $sha on $BRANCH, parent $parent."

      - name: Open the pin PR
        id: pin
        if: github.ref == format('refs/heads/{0}', inputs.deploy-branch)
        working-directory: infra-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANGED: ${{ steps.rewrite.outputs.changed }}
          BRANCH: ${{ steps.rewrite.outputs.branch }}
          TITLE: ${{ steps.rewrite.outputs.title }}
          IMAGE_REF: ${{ steps.digest.outputs.image }}
          TAG_REF: ${{ steps.target.outputs.image }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
        run: |
          set -euo pipefail

          if [ "$CHANGED" != "true" ]; then
            echo "pr_url=(already pinned, no change)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Opened with the App token minted above. GitHub suppresses other workflow runs triggered by
          # GITHUB_TOKEN-authored pushes and PRs, so the infra repo's required
          # status checks would never fire and the PR would sit unmergeable.
          BODY="Automated image pin from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. Merging runs ${INFRA_NAME}'s apply-on-merge, which deploys this image to dfo-${TIER}."$'\n\n'"Digest (pinned): ${IMAGE_REF}"$'\n'"Tag (browsable): ${TAG_REF}"

          pr_url=$(gh pr list --repo "$INFRA_REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --repo "$INFRA_REPO" \
              --base "$INFRA_BASE" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY")
          else
            # No --repo: gh infers it from the URL positional argument and
            # silently ignores --repo when both are given.
            gh pr edit "$pr_url" \
              --title "$TITLE" \
              --body "$BODY"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

          # Auto-merge is armed here, with the App token, because a merge made
          # with GITHUB_TOKEN creates no workflow runs, so the infra repo's
          # apply.yml would never fire on the merged pin. Auto-merge waits on
          # the base branch's ruleset: on infra `dev`, its required checks
          # (`Changed stacks planned` among them), with no approval.
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$pr_url" --auto --squash
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "### dcp ${TIER} deploy"
            echo ""
            echo "- Image tag: \`${{ steps.target.outputs.image }}\`"
            echo "- Image digest (pinned): \`${{ steps.digest.outputs.image }}\`"
            echo "- Pin PR: ${{ steps.pin.outputs.pr_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
