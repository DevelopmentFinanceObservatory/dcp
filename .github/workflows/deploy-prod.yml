name: Deploy prod

# ONE/DFO: builds the dcp image into prod's Artifact Registry and opens the
# image-pin PR into DevelopmentFinanceObservatory/infra's `main` branch.
# build-and-pin.yml holds the steps, shared with deploy-dev.yml.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancels an older run still mid-build so it can't push a stale pin after a
# newer run's force-push has already landed.
concurrency:
  group: deploy-dcp-prod
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-and-deploy:
    needs: checks
    uses: ./.github/workflows/build-and-pin.yml
    # A called workflow sees no secrets, its environment's included, without this.
    secrets: inherit
    with:
      environment: production
      tier: prod
      deploy-branch: main
      infra-base: main
      # A release team member approves and merges the pin PR.
      auto-merge: false
      app: dfo-release
