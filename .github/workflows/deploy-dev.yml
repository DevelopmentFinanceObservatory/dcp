name: Deploy dev

# ONE/DFO: builds the dcp image into dev's Artifact Registry and opens the
# image-pin PR into DevelopmentFinanceObservatory/infra's `dev` branch.
# build-and-pin.yml holds the steps, shared with deploy-prod.yml.

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Cancels an older run still mid-build so it can't push a stale pin after a
# newer run's force-push has already landed.
concurrency:
  group: deploy-dcp-dev
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Same checks ci.yml runs. The build job below needs: it so a push that
  # lands with red tests (workflow_dispatch, an admin override) can't still
  # deploy.
  checks:
    uses: ./.github/workflows/checks.yml

  build-and-deploy:
    needs: checks
    uses: ./.github/workflows/build-and-pin.yml
    # A called workflow sees no secrets, its environment's included, without this.
    secrets: inherit
    with:
      environment: dev
      tier: dev
      deploy-branch: dev
      infra-base: dev
      # Infra `dev` needs no approval, so the armed auto-merge lands the pin
      # once that branch's required checks pass.
      auto-merge: true
      app: dfo-pin
